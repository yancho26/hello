# Сглобява инсталатора и файла за обновяване за Windows и ги проверява на
# истински Windows.
#
# Готовият инсталатор е в Actions → това изпълнение → Artifacts →
# DocUp-Setup. При етикет v* (например v3.0.0) се публикува и като Release.
#
# Проверява се и преминаването от „Детска консултация“ 2.2.0 (старото име):
# тя се сглобява от своя commit, инсталира се и се обновява до DocUp.

name: Windows инсталатор

on:
  push:
    # Без изрично изброени клонове GitHub пуска проверката само за етикетите.
    branches: ['**']
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'installer/**'
      - 'lib/**'
      - 'public/**'
      - 'test/**'
      - 'server.js'
      - 'scripts/build-windows.mjs'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Сглобяване (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Node.js за Windows (кеш)
        uses: actions/cache@v4
        with:
          path: build/cache
          key: nodejs-${{ hashFiles('scripts/build-windows.mjs') }}
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: DocUp-Setup
          path: dist/
          retention-days: 90
          if-no-files-found: error
      # Истинските продуктови ключове не са в хранилището. За проверката се
      # сглобява отделна версия, която приема и един еднократен ключ, създаден
      # тук. Тя се пази един ден и не е за раздаване.
      - name: Проверочна версия с еднократен тестов ключ
        run: |
          HASH=$(node --input-type=module -e "import fs from 'node:fs'; import { generateKey, keyHash, formatKey } from './lib/license.js'; const k = generateKey(); fs.writeFileSync('test-key.txt', formatKey(k)); console.log(keyHash(k));")
          DOCUP_TEST_KEY_HASHES=$HASH DOCUP_DIST=dist-test npm run build:win
          mv test-key.txt dist-test/
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-test-build
          path: dist-test/
          retention-days: 1
          if-no-files-found: error

  build-legacy:
    name: Сглобяване на „Детска консултация“ 2.2.0 (за прехода)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2a7cd09c5c3c6ef35dbb052a968c84cf9a0ec2ed
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Node.js за Windows (кеш)
        uses: actions/cache@v4
        with:
          path: build/cache
          key: nodejs-${{ hashFiles('scripts/build-windows.mjs') }}
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-2.2.0
          path: dist/DetskaKonsultacia-Setup-*.exe
          retention-days: 7
          if-no-files-found: error

  smoke-test:
    name: Проверка (Windows)
    needs: [build, build-legacy]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smoke-test-build
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: legacy-2.2.0
          path: legacy
      - name: Преминаване от „Детска консултация“ 2.2.0 към DocUp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base    = 'http://localhost:8080'
          $old     = 'C:\Program Files\DetskaKonsultacia\DetskaKonsultacia.exe'
          $new     = 'C:\Program Files\DocUp\DocUp.exe'
          $menu    = 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs'
          $legacy  = (Get-ChildItem legacy\DetskaKonsultacia-Setup-*.exe | Select-Object -First 1).FullName
          $update  = (Get-ChildItem dist\DocUp-Update-*.exe | Select-Object -First 1).FullName
          $version = [regex]::Match($update, 'Update-(.+)\.exe$').Groups[1].Value
          $env:DETSKA_NO_BROWSER = '1'

          function Wait-Up([int]$seconds = 60) {
            for ($i = 0; $i -lt $seconds; $i++) {
              try { $st = Invoke-RestMethod "$base/api/state"; if ($st.app -in 'docup', 'detska-konsultacia') { return $st } } catch {}
              Start-Sleep 1
            }
            return $null
          }

          Write-Host '== Инсталиране на старата версия 2.2.0'
          Start-Process $legacy -ArgumentList '/S' -Wait
          if (-not (Test-Path $old)) { throw 'Старата версия не е инсталирана.' }
          Start-Process $old -ArgumentList '--background'
          $st = Wait-Up
          if ($st.app -ne 'detska-konsultacia') { throw 'Старата версия не тръгна.' }
          $body = @{ practiceName = 'Преход'; doctorName = 'д-р Стара'; pin = '4321' } | ConvertTo-Json
          Invoke-RestMethod -Method Post "$base/api/setup" -Body ([Text.Encoding]::UTF8.GetBytes($body)) -ContentType 'application/json; charset=utf-8' -SessionVariable s | Out-Null
          $child = @{ name = 'Мария Старова'; birthDate = (Get-Date).AddYears(-3).ToString('yyyy-MM-dd'); sex = 'f' } | ConvertTo-Json
          Invoke-RestMethod -Method Post "$base/api/patients" -Body ([Text.Encoding]::UTF8.GetBytes($child)) -ContentType 'application/json; charset=utf-8' -WebSession $s | Out-Null

          Write-Host "== Файл за обновяване на DocUp $version върху работещата стара версия"
          $u = Start-Process $update -ArgumentList '/S' -PassThru -Wait
          if ($u.ExitCode -ne 0) { throw "Обновяването върна код $($u.ExitCode)." }
          $st = Wait-Up
          if ($st.app -ne 'docup') {
            Get-Content 'C:\ProgramData\DocUp\logs\server.log' -Tail 30 -ErrorAction SilentlyContinue
            throw 'DocUp не тръгна след прехода.'
          }
          if (-not (Test-Path $new)) { throw 'DocUp.exe липсва.' }
          # След обновяването DocUp иска продуктов ключ, преди да покаже данните.
          if (-not $st.needsActivation) { throw 'DocUp не поиска продуктов ключ.' }
          $blocked = Invoke-WebRequest "$base/api/patients" -WebSession $s -SkipHttpErrorCheck -UseBasicParsing
          if ($blocked.StatusCode -ne 403) { throw "Данните се виждат без ключ ($($blocked.StatusCode))." }
          $key = (Get-Content dist\test-key.txt -Raw).Trim()
          Invoke-RestMethod -Method Post "$base/api/activate" -Body (@{ key = $key } | ConvertTo-Json) -ContentType 'application/json' | Out-Null
          if (Test-Path 'C:\Program Files\DetskaKonsultacia') { throw 'Старата папка на програмата остана.' }
          if (Test-Path 'C:\ProgramData\DetskaKonsultacia') { throw 'Данните не са преместени.' }
          $data = Get-Content 'C:\ProgramData\DocUp\data\practice.json' -Raw -Encoding utf8 | ConvertFrom-Json
          if ($data.patients.Count -ne 1 -or $data.practice.name -ne 'Преход') { throw 'Данните не са пренесени.' }
          $list = Invoke-RestMethod "$base/api/patients" -WebSession $s
          if ($list.total -ne 1) { throw 'Сесията отпреди прехода не важи.' }
          $key = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          if ((Get-ItemProperty "$key\DocUp").DisplayVersion -ne $version) { throw 'DocUp липсва в Приложения.' }
          if (Test-Path "$key\DetskaKonsultacia") { throw 'Старата програма остана в Приложения.' }
          foreach ($l in "$menu\DocUp\DocUp.lnk", "$menu\Startup\DocUp.lnk", 'C:\Users\Public\Desktop\DocUp.lnk') {
            if (-not (Test-Path $l)) { throw "Липсва пряк път $l." }
          }
          foreach ($l in "$menu\Детска консултация", "$menu\Startup\Детска консултация.lnk", 'C:\Users\Public\Desktop\Детска консултация.lnk') {
            if (Test-Path $l) { throw "Остана стар пряк път $l." }
          }
          netsh advfirewall firewall show rule name=DocUp | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Правилото в защитната стена не е пренесено.' }
          netsh advfirewall firewall show rule name=DetskaKonsultacia | Out-Null
          if ($LASTEXITCODE -eq 0) {
            netsh advfirewall firewall show rule name=DetskaKonsultacia verbose
            throw 'Старото правило в защитната стена остана.'
          }
          Write-Host 'Преходът е успешен.'

          Write-Host '== Почистване преди основната проверка'
          Start-Process $new -ArgumentList '--stop', '--quiet' -Wait
          Start-Process 'C:\Program Files\DocUp\uninstall.exe' -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path $new); $i++) { Start-Sleep 1 }
          Remove-Item 'C:\ProgramData\DocUp' -Recurse -Force
          $global:LASTEXITCODE = 0
      - name: Инсталиране, работа, спиране, обновяване, деинсталиране
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe    = 'C:\Program Files\DocUp\DocUp.exe'
          $data   = 'C:\ProgramData\DocUp\data\practice.json'
          $desk   = 'C:\Users\Public\Desktop\DocUp.lnk'
          $base   = 'http://localhost:8080'
          $setup  = (Get-ChildItem dist\DocUp-Setup-*.exe | Select-Object -First 1).FullName
          $update = (Get-ChildItem dist\DocUp-Update-*.exe | Select-Object -First 1).FullName
          $version = [regex]::Match($setup, 'Setup-(.+)\.exe$').Groups[1].Value
          $env:DETSKA_NO_BROWSER = '1'

          function Wait-Up([int]$seconds = 60, [string]$url = $base) {
            for ($i = 0; $i -lt $seconds; $i++) {
              try { $st = Invoke-RestMethod "$url/api/state"; if ($st.app -eq 'docup') { return $true } } catch {}
              Start-Sleep 1
            }
            return $false
          }
          function Wait-Down([int]$seconds = 20) {
            for ($i = 0; $i -lt $seconds; $i++) {
              if (-not (Get-Process DocUp -ErrorAction SilentlyContinue)) { return $true }
              Start-Sleep 1
            }
            return $false
          }
          function Patients { (Get-Content $data -Raw -Encoding utf8 | ConvertFrom-Json).patients.Count }

          Write-Host "== Тихо инсталиране на $version"
          Start-Process $setup -ArgumentList '/S' -Wait
          if (-not (Test-Path $exe)) { throw 'Програмата не е инсталирана.' }
          Get-Item $exe | Format-List Name, Length, VersionInfo
          Get-ChildItem 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs' -Recurse -Filter *.lnk |
            Where-Object FullName -like '*DocUp*' | ForEach-Object FullName
          icacls C:\ProgramData\DocUp
          netsh advfirewall firewall show rule name=DocUp
          if ($LASTEXITCODE -ne 0) { throw 'Липсва правилото в защитната стена.' }

          Write-Host '== Стартиране'
          Start-Process $exe -ArgumentList '--background'
          if (-not (Wait-Up)) {
            Get-Content 'C:\ProgramData\DocUp\logs\server.log' -ErrorAction SilentlyContinue
            throw 'Сървърът не отговаря.'
          }
          $page = Invoke-WebRequest "$base/" -UseBasicParsing
          if ($page.Content -notmatch 'DocUp') { throw 'Интерфейсът не се зарежда.' }
          foreach ($f in 'js/shared/growth.js', 'js/connection.js', 'js/views/history-dialog.js', 'js/views/adult-patient.js', 'js/shared/nutrition.js', 'js/shared/drugs.js', 'js/boot-check.js', 'favicon.svg') {
            if ((Invoke-WebRequest "$base/$f" -UseBasicParsing).StatusCode -ne 200) { throw "Липсва вграден файл $f." }
          }

          Write-Host '== Заглавки за сигурност и чужд адрес (DNS rebinding)'
          $csp = [string]$page.Headers['Content-Security-Policy']
          Write-Host "CSP: $csp"
          if ($csp -notmatch "frame-ancestors 'none'") { throw 'Липсва политиката за съдържание.' }
          if ([string]$page.Headers['X-Frame-Options'] -ne 'DENY') { throw 'Липсва X-Frame-Options.' }
          $code = & curl.exe -s -o NUL -w '%{http_code}' -H 'Host: evil.example.com' "$base/api/state"
          if ($code -ne '421') { throw "Чужд адрес в Host върна $code вместо 421." }
          $code = & curl.exe -s -o NUL -w '%{http_code}' -H "Host: $($env:COMPUTERNAME):8080" "$base/api/state"
          if ($code -ne '200') { throw "Името на компютъра в Host върна $code." }
          Get-Process DocUp | Format-Table Id, ProcessName, MainWindowHandle, WorkingSet64

          Write-Host '== Активиране с продуктов ключ'
          $st = Invoke-RestMethod "$base/api/state"
          if (-not $st.needsActivation) { throw 'Програмата не поиска продуктов ключ.' }
          $code = (Invoke-WebRequest -Method Post "$base/api/setup" -Body '{}' -ContentType 'application/json' -SkipHttpErrorCheck -UseBasicParsing).StatusCode
          if ($code -ne 403) { throw "Настройката е достъпна без ключ ($code)." }
          $code = (Invoke-WebRequest -Method Post "$base/api/activate" -Body (@{ key = 'DOCUP-00000-00000-00000-00000' } | ConvertTo-Json) -ContentType 'application/json' -SkipHttpErrorCheck -UseBasicParsing).StatusCode
          if ($code -eq 200) { throw 'Приет е невалиден ключ.' }
          $key = (Get-Content dist\test-key.txt -Raw).Trim()
          $act = Invoke-RestMethod -Method Post "$base/api/activate" -Body (@{ key = $key } | ConvertTo-Json) -ContentType 'application/json'
          if (-not $act.license.active) { throw 'Активирането не успя.' }
          Write-Host "Активиран с $($act.license.key)"

          Write-Host '== Запис на данни'
          $body = @{ practiceName = 'Проверка'; doctorName = 'д-р Тест'; pin = '1234' } | ConvertTo-Json
          Invoke-RestMethod -Method Post "$base/api/setup" -Body ([Text.Encoding]::UTF8.GetBytes($body)) -ContentType 'application/json; charset=utf-8' | Out-Null
          $doctorId = (Invoke-RestMethod "$base/api/state").doctors[0].id
          Invoke-RestMethod -Method Post "$base/api/login" -Body (@{ doctorId = $doctorId; pin = '1234' } | ConvertTo-Json) -ContentType 'application/json' -SessionVariable s | Out-Null
          $child = @{ name = 'Иван Иванов'; birthDate = (Get-Date).AddMonths(-7).ToString('yyyy-MM-dd'); sex = 'm' } | ConvertTo-Json
          $created = Invoke-RestMethod -Method Post "$base/api/patients" -Body ([Text.Encoding]::UTF8.GetBytes($child)) -ContentType 'application/json; charset=utf-8' -WebSession $s
          $card = Invoke-RestMethod "$base/api/patients/$($created.patient.id)" -WebSession $s
          Write-Host "Дете: $($card.patient.name), дейности в плана: $($card.plan.Count)"
          if ($card.plan.Count -lt 10) { throw 'Планът на детето не е изчислен.' }

          Write-Host '== Налучкване на ПИН'
          $codes = foreach ($i in 1..6) {
            (Invoke-WebRequest -Method Post "$base/api/login" -Body (@{ doctorId = $doctorId; pin = "000$i" } | ConvertTo-Json) -ContentType 'application/json' -SkipHttpErrorCheck -UseBasicParsing).StatusCode
          }
          Write-Host "Отговори: $($codes -join ', ')"
          if ($codes[4] -ne 401 -or $codes[5] -ne 429) { throw 'След 5 грешни ПИН-а входът не изчаква.' }
          $check = Invoke-RestMethod "$base/api/system/check" -WebSession $s
          $check.items | ForEach-Object { Write-Host "  [$($_.level)] $($_.title)" }
          if (-not ($check.items | Where-Object { $_.title -like '*заключен вход*' })) { throw 'Проверката не показва заключения вход.' }
          if (-not ($check.items | Where-Object { $_.title -like '*диска*' })) { throw 'Проверката не показва мястото на диска.' }
          if (-not $check.canChangeNetwork) { throw 'Мрежата не може да се променя от този компютър.' }

          Write-Host '== Възрастен пациент'
          $post = { param($url, $obj) Invoke-RestMethod -Method Post "$base$url" -Body ([Text.Encoding]::UTF8.GetBytes(($obj | ConvertTo-Json -Depth 5))) -ContentType 'application/json; charset=utf-8' -WebSession $s }
          $adult = & $post '/api/patients' @{ name = 'Петър Петров'; birthDate = (Get-Date).AddYears(-66).ToString('yyyy-MM-dd'); sex = 'm' }
          $aid = $adult.patient.id
          & $post "/api/patients/$aid/chronic" @{ code = 'dm2'; since = '2015-03-01' } | Out-Null
          & $post "/api/patients/$aid/chronic" @{ code = 'htn' } | Out-Null
          & $post "/api/patients/$aid/measurements" @{ weight = 92; height = 176; waist = 106; systolic = 152; diastolic = 90 } | Out-Null
          foreach ($d in 'ramipril', 'hydrochlorothiazide') { & $post "/api/patients/$aid/meds" @{ drug = $d; schedule = @{ m = '1' } } | Out-Null }
          $nsaid = & $post "/api/patients/$aid/meds" @{ drug = 'ibuprofen'; prn = $true }
          if (-not ($nsaid.alerts | Where-Object { $_.severity -eq 'major' })) { throw 'Няма сигнал за троен удар (ACEi, диуретик и НСПВС).' }
          $today = (Get-Date).ToString('yyyy-MM-dd')
          $labs = & $post "/api/patients/$aid/results" @{ date = $today; items = @(@{ code = 'hba1c'; value = 64; unit = 'mmol/mol' }, @{ code = 'tchol'; value = 5.8 }, @{ code = 'hdl'; value = 1.1 }, @{ code = 'ldl'; value = 3.6 }, @{ code = 'creat'; value = 105 }) }
          if ([math]::Abs($labs.results[0].value - 8.0) -gt 0.05) { throw "HbA1c не е преобразуван: $($labs.results[0].value)." }
          $phq = & $post "/api/patients/$aid/assessments" @{ tool = 'phq9'; answers = @(1, 1, 1, 1, 1, 1, 1, 0, 1) }
          if ($phq.assessment.result.alerts.Count -ne 1) { throw 'Няма сигнал при положителен въпрос 9 на PHQ-9.' }
          $plan = & $post "/api/patients/$aid/nutrition" @{ goal = 'lose' }
          Write-Host "Хранителен режим: $($plan.plan.targets.kcal) kcal, белтък $($plan.plan.targets.protein) г"
          if ($plan.plan.meals.Count -ne 5) { throw 'Хранителният режим няма пет хранения.' }
          $full = Invoke-RestMethod "$base/api/patients/$aid" -WebSession $s
          Write-Host "Риск: $($full.adult.cv.model) $($full.adult.cv.score)% · сигнали за лекарства: $($full.adult.medAlerts.Count) · проследяване: $($full.adult.monitoring.Count)"
          if ($full.adult.cv.model -ne 'SCORE2-Diabetes') { throw 'SCORE2-Diabetes не е изчислен.' }
          $rep = Invoke-RestMethod "$base/api/reports" -WebSession $s
          if (($rep.chronic | Where-Object { $_.code -eq 'dm2' }).count -ne 1) { throw 'Регистърът на заболяванията не отчита пациента.' }

          Write-Host '== Внасяне на списък: CSV в Windows-1251 и Excel 97-2003'
          $csv = ''
          $xls = ''
          $readCsv = & $post '/api/import/read' @{ filename = 'spisak.csv'; data = $csv }
          if ($readCsv.encoding -ne 'Windows-1251') { throw "Кодировката е $($readCsv.encoding)." }
          $sh = $readCsv.sheets[0]
          $imp = @{ rows = @($sh.rows | Select-Object -Skip ($sh.headerRow + 1)); header = $sh.rows[$sh.headerRow]; mapping = $sh.mapping; firstRow = $sh.headerRow + 2; dryRun = $false; source = 'spisak.csv' }
          $res = & $post '/api/import/patients' $imp
          Write-Host "Внесени от CSV: $($res.done.created), копие: $($res.backup)"
          if ($res.done.created -ne 4) { throw 'От CSV не са внесени 4 пациента.' }
          $readXls = & $post '/api/import/read' @{ filename = 'spisak.xls'; data = $xls }
          $sh = $readXls.sheets[0]
          $imp = @{ rows = @($sh.rows | Select-Object -Skip ($sh.headerRow + 1)); header = $sh.rows[$sh.headerRow]; mapping = $sh.mapping; firstRow = $sh.headerRow + 2 }
          $dry = & $post '/api/import/patients' $imp
          Write-Host "Проверка на .xls: нови $($dry.summary.create), за допълване $($dry.summary.update), с грешки $($dry.summary.error)"
          if ($dry.summary.create -ne 1 -or $dry.summary.update -ne 4 -or $dry.summary.error -ne 1) { throw 'Файлът .xls не е разчетен както се очаква.' }

          $boot = Invoke-RestMethod "$base/api/bootstrap" -WebSession $s
          if ($boot.server.version -ne $version) { throw "Версията е $($boot.server.version), очаква се $version." }
          if (-not $boot.server.canStop -or -not $boot.server.local) { throw 'Бутонът за спиране не е достъпен на този компютър.' }

          Write-Host '== Външно копие'
          $extra = 'C:\ExtraCopy\DocUp'
          $patch = @{ extraBackupDir = $extra } | ConvertTo-Json
          $res = Invoke-RestMethod -Method Patch "$base/api/settings" -Body ([Text.Encoding]::UTF8.GetBytes($patch)) -ContentType 'application/json; charset=utf-8' -WebSession $s
          if (-not $res.extraBackup.ok) { throw 'Външното копие не е направено.' }
          Get-ChildItem $extra | Format-Table Name, Length

          Write-Host '== Второ стартиране — само отваря браузъра'
          $second = Start-Process $exe -ArgumentList '--background' -PassThru -Wait
          if ($second.ExitCode -ne 0) { throw 'Второто стартиране не завърши чисто.' }
          if ((Get-Process DocUp -ErrorAction SilentlyContinue).Count -ne 1) { throw 'Стартирано е второ копие.' }

          Write-Host '== Спиране от бутона в програмата'
          Invoke-RestMethod -Method Post "$base/api/system/stop" -Body '{}' -ContentType 'application/json' -WebSession $s | Out-Null
          if (-not (Wait-Down)) { throw 'Програмата не спря от бутона.' }
          if ((Patients) -ne 6) { throw 'Данните не са записани.' }

          Write-Host '== Файл за обновяване върху работеща програма'
          Remove-Item $desk -ErrorAction SilentlyContinue   # потребителят е махнал иконата
          # Друга програма е оставила NODE_OPTIONS с липсващ файл — досега това спираше стартирането.
          $env:NODE_OPTIONS = '--require C:\nonexistent\hook.js'
          Start-Process $exe -ArgumentList '--background'
          if (-not (Wait-Up)) { throw 'Програмата не тръгна при зададен NODE_OPTIONS.' }
          Remove-Item Env:NODE_OPTIONS
          $u = Start-Process $update -ArgumentList '/S' -PassThru -Wait
          if ($u.ExitCode -ne 0) { throw "Обновяването върна код $($u.ExitCode)." }
          if (-not (Wait-Up 45)) { throw 'След тихо обновяване програмата не тръгна отново.' }
          if ((Patients) -ne 6) { throw 'Обновяването засегна данните.' }
          if (Test-Path $desk) { throw 'Обновяването върна иконата, която потребителят беше махнал.' }
          if (-not (Test-Path 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup\DocUp.lnk')) { throw 'Автоматичното стартиране изчезна.' }
          netsh advfirewall firewall show rule name=DocUp | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Правилото в защитната стена изчезна.' }
          $ver = (Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\DocUp').DisplayVersion
          if ($ver -ne $version) { throw "Версията в Приложения е $ver." }

          Write-Host '== Пълен инсталатор върху работеща програма'
          $f = Start-Process $setup -ArgumentList '/S' -PassThru -Wait
          if ($f.ExitCode -ne 0) { throw "Пълният инсталатор върна код $($f.ExitCode)." }
          if (-not (Wait-Up 45)) { throw 'След пълния инсталатор програмата не тръгна отново.' }
          if (Test-Path $desk) { throw 'Пълният инсталатор не запази избора без икона на работния плот.' }
          if ((Patients) -ne 6) { throw 'Пълният инсталатор засегна данните.' }

          Write-Host '== Спиране от менюто Старт'
          $stop = Start-Process $exe -ArgumentList '--stop', '--quiet' -PassThru -Wait
          if ($stop.ExitCode -ne 0) { throw 'Спирането върна грешка.' }
          if (-not (Wait-Down)) { throw 'Програмата не спря.' }
          if (-not (Test-Path "$extra\practice-$((Get-Date).ToString('yyyy-MM-dd')).json")) { throw 'Няма външно копие при спиране.' }

          Write-Host '== Порт 8080 е зает от друга програма'
          $env:DETSKA_NO_DIALOGS = '1'
          $blocker = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Any, 8080)
          $blocker.Start()
          Start-Process $exe -ArgumentList '--background'
          if (-not (Wait-Up 60 'http://localhost:8081')) {
            Get-Content 'C:\ProgramData\DocUp\logs\server.log' -Tail 20 -ErrorAction SilentlyContinue
            throw 'Програмата не премина на порт 8081.'
          }
          $cfg = Get-Content 'C:\ProgramData\DocUp\config.json' -Raw -Encoding utf8 | ConvertFrom-Json
          if ($cfg.port -ne 8081) { throw "Новият порт не е запомнен: $($cfg.port)." }
          $again = Start-Process $exe -ArgumentList '--background' -PassThru -Wait
          if ($again.ExitCode -ne 0 -or (Get-Process DocUp).Count -ne 1) { throw 'Второ стартиране на резервния порт пусна ново копие.' }
          $stop = Start-Process $exe -ArgumentList '--stop', '--quiet' -PassThru -Wait
          if (-not (Wait-Down)) { throw 'Програмата на порт 8081 не спря.' }
          $blocker.Stop()

          Write-Host '== Тихо деинсталиране'
          Start-Process 'C:\Program Files\DocUp\uninstall.exe' -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep 1 }
          if (Test-Path $exe) { throw 'Програмата не е премахната.' }
          if (-not (Test-Path $data)) { throw 'Деинсталирането изтри данните.' }
          netsh advfirewall firewall show rule name=DocUp | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'Правилото в защитната стена остана.' }

          Write-Host '== Файл за обновяване без инсталирана програма'
          $n = Start-Process $update -ArgumentList '/S' -PassThru -Wait
          if ($n.ExitCode -ne 2) { throw "Очаква се код 2, получен е $($n.ExitCode)." }
          if (Test-Path $exe) { throw 'Файлът за обновяване инсталира програмата.' }

          $global:LASTEXITCODE = 0
          Write-Host 'Всички проверки минаха.'

  release:
    name: Публикуване
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DocUp-Setup
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DocUp-Setup-*.exe
            dist/DocUp-Update-*.exe
            dist/SHA256SUMS.txt

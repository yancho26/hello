# Сглобява инсталатора за Windows и го проверява на истински Windows.
#
# Готовият инсталатор е в Actions → това изпълнение → Artifacts →
# DetskaKonsultacia-Setup. При етикет v* (например v1.0.0) се публикува и
# като Release.

name: Windows инсталатор

on:
  push:
    # Без изрично изброени клонове GitHub пуска проверката само за етикетите.
    branches: ['**']
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'installer/**'
      - 'lib/**'
      - 'public/**'
      - 'test/**'
      - 'server.js'
      - 'scripts/build-windows.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Сглобяване (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Node.js за Windows (кеш)
        uses: actions/cache@v4
        with:
          path: build/cache
          key: nodejs-${{ hashFiles('scripts/build-windows.mjs') }}
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: DetskaKonsultacia-Setup
          path: dist/
          retention-days: 90
          if-no-files-found: error

  smoke-test:
    name: Проверка (Windows)
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DetskaKonsultacia-Setup
          path: dist
      - name: Инсталиране, работа, спиране, деинсталиране
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe  = 'C:\Program Files\DetskaKonsultacia\DetskaKonsultacia.exe'
          $data = 'C:\ProgramData\DetskaKonsultacia\data\practice.json'
          $base = 'http://localhost:8080'
          $setup = (Get-ChildItem dist\DetskaKonsultacia-Setup-*.exe | Select-Object -First 1).FullName

          Write-Host '== Тихо инсталиране'
          Start-Process $setup -ArgumentList '/S' -Wait
          if (-not (Test-Path $exe)) { throw 'Програмата не е инсталирана.' }
          Get-Item $exe | Format-List Name, Length, VersionInfo
          Get-ChildItem 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs' -Recurse -Filter *.lnk |
            Where-Object FullName -like '*Детска*' | ForEach-Object FullName
          icacls C:\ProgramData\DetskaKonsultacia
          netsh advfirewall firewall show rule name=DetskaKonsultacia
          if ($LASTEXITCODE -ne 0) { throw 'Липсва правилото в защитната стена.' }

          Write-Host '== Стартиране'
          $env:DETSKA_NO_BROWSER = '1'
          Start-Process $exe -ArgumentList '--background'
          $state = $null
          for ($i = 0; $i -lt 60 -and -not $state; $i++) {
            try { $state = Invoke-RestMethod "$base/api/state" } catch { Start-Sleep 1 }
          }
          if (-not $state -or $state.app -ne 'detska-konsultacia') {
            Get-Content 'C:\ProgramData\DetskaKonsultacia\logs\server.log' -ErrorAction SilentlyContinue
            throw 'Сървърът не отговаря.'
          }
          $page = Invoke-WebRequest "$base/" -UseBasicParsing
          if ($page.Content -notmatch 'Детска консултация') { throw 'Интерфейсът не се зарежда.' }
          $js = Invoke-WebRequest "$base/js/shared/growth.js" -UseBasicParsing
          if ($js.StatusCode -ne 200) { throw 'Липсва вграден файл.' }
          $proc = Get-Process DetskaKonsultacia
          $proc | Format-Table Id, ProcessName, MainWindowHandle, WorkingSet64

          Write-Host '== Запис на данни'
          $body = @{ practiceName = 'Проверка'; doctorName = 'д-р Тест'; pin = '1234' } | ConvertTo-Json
          Invoke-RestMethod -Method Post "$base/api/setup" -Body ([Text.Encoding]::UTF8.GetBytes($body)) -ContentType 'application/json; charset=utf-8' | Out-Null
          $login = @{ doctorId = ''; pin = '1234' }
          $doctors = (Invoke-RestMethod "$base/api/state").doctors
          $login.doctorId = $doctors[0].id
          Invoke-RestMethod -Method Post "$base/api/login" -Body ($login | ConvertTo-Json) -ContentType 'application/json' -SessionVariable s | Out-Null
          $child = @{ name = 'Иван Иванов'; birthDate = (Get-Date).AddMonths(-7).ToString('yyyy-MM-dd'); sex = 'm' } | ConvertTo-Json
          $created = Invoke-RestMethod -Method Post "$base/api/patients" -Body ([Text.Encoding]::UTF8.GetBytes($child)) -ContentType 'application/json; charset=utf-8' -WebSession $s
          $card = Invoke-RestMethod "$base/api/patients/$($created.patient.id)" -WebSession $s
          Write-Host "Дете: $($card.patient.name), дейности в плана: $($card.plan.Count)"
          if ($card.plan.Count -lt 10) { throw 'Планът на детето не е изчислен.' }

          Write-Host '== Второ стартиране — само отваря браузъра'
          $second = Start-Process $exe -ArgumentList '--background' -PassThru -Wait
          if ($second.ExitCode -ne 0) { throw 'Второто стартиране не завърши чисто.' }
          if ((Get-Process DetskaKonsultacia -ErrorAction SilentlyContinue).Count -ne 1) { throw 'Стартирано е второ копие.' }

          Write-Host '== Спиране'
          $stop = Start-Process $exe -ArgumentList '--stop', '--quiet' -PassThru -Wait
          if ($stop.ExitCode -ne 0) { throw 'Спирането върна грешка.' }
          Start-Sleep 2
          if (Get-Process DetskaKonsultacia -ErrorAction SilentlyContinue) { throw 'Програмата не спря.' }
          $saved = Get-Content $data -Raw -Encoding utf8 | ConvertFrom-Json
          if ($saved.patients.Count -ne 1) { throw 'Данните не са записани.' }

          Write-Host '== Обновяване върху съществуваща инсталация'
          Start-Process $exe -ArgumentList '--background'
          Start-Sleep 3
          Start-Process $setup -ArgumentList '/S' -Wait
          if (Get-Process DetskaKonsultacia -ErrorAction SilentlyContinue) { throw 'Инсталаторът не спря програмата.' }
          if (((Get-Content $data -Raw -Encoding utf8 | ConvertFrom-Json).patients.Count) -ne 1) { throw 'Обновяването засегна данните.' }

          Write-Host '== Тихо деинсталиране'
          Start-Process 'C:\Program Files\DetskaKonsultacia\uninstall.exe' -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path $exe); $i++) { Start-Sleep 1 }
          if (Test-Path $exe) { throw 'Програмата не е премахната.' }
          if (-not (Test-Path $data)) { throw 'Деинсталирането изтри данните.' }
          netsh advfirewall firewall show rule name=DetskaKonsultacia | Out-Null
          if ($LASTEXITCODE -eq 0) { throw 'Правилото в защитната стена остана.' }
          $global:LASTEXITCODE = 0
          Write-Host 'Всички проверки минаха.'

  release:
    name: Публикуване
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DetskaKonsultacia-Setup
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DetskaKonsultacia-Setup-*.exe
            dist/SHA256SUMS.txt
